name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the image
        run: docker build -t dsh-superagent:ci --build-arg SUPERAGENT_REF=main .

      - name: Check the prerequisites inside the image
        run: |
          docker run --rm --entrypoint /bin/bash dsh-superagent:ci -lc '
            set -e
            python3 --version
            tmux -V
            gh --version | head -1
            node -v
            dsh --version
            pnpm --version
          '

      - name: Check the bundle built, and the patch applied
        run: |
          docker run --rm --entrypoint /bin/bash dsh-superagent:ci -lc '
            set -e
            test -f /opt/dsh-superagent/lib/index.js
            test -f /opt/dsh-superagent/lib/client.js
            grep -q "SERVICE_COMMANDS" /opt/dsh-superagent/scripts/dsh-superagent
            echo "bundle + patch OK"
          '

      - name: Validate compose and entrypoint syntax
        run: |
          docker compose config > /dev/null
          bash -n entrypoint.sh scripts/smoke-test.sh

  # The build job proves the image; this job proves the entrypoint: profile
  # creation, bundle install, the socat hop, tmux start, DSH boot and the token
  # line. It needs no model provider, no GitHub account and no bot: setup is
  # expected to stop at "no repository", which is what the panel fixes.
  runtime:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v5

      - name: Build the image
        run: docker build -t dsh-superagent:ci .

      - name: Start it and wait for the management API
        run: |
          set -euo pipefail
          docker run -d --name dsh-superagent -p 127.0.0.1:3082:13082 \
            -e DSH_SUPERAGENT_ACCESS=proxy -e DSH_SUPERAGENT_PUBLISHED_PORT=3082 \
            dsh-superagent:ci
          for _ in $(seq 1 60); do
            if curl -sf -H 'x-orchestrator-request: 1' \
                 http://127.0.0.1:3082/orchestrator/api/state > state.json; then
              echo "management API answered"; break
            fi
            sleep 3
          done
          test -s state.json

      - name: Assert the container is running and waiting for setup
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d = json.load(open("state.json"))
          problem = (d.get("setup") or {}).get("problem") or {}
          print("setup problem:", json.dumps(problem, ensure_ascii=False))
          # With no account configured the Source has no repository yet: exactly
          # the state a fresh install must reach before a person fills the panel.
          assert problem.get("code") == "repositoryUnset", problem
          PY
          # 3 = running, setup waits. That is the success case here.
          code=0
          docker exec dsh-superagent scripts/dsh-superagent status || code=$?
          echo "status exit=$code"
          test "$code" = "3"

      - name: Assert the panel URL with a token was printed
        run: |
          docker logs dsh-superagent 2>&1 | tee container.log
          grep -Eq 'panel: http://localhost:3082/\?token=[A-Za-z0-9_-]+' container.log

      - name: Container logs on failure
        if: failure()
        run: docker logs dsh-superagent || true

      - name: Clean up
        if: always()
        run: docker rm -f dsh-superagent || true
