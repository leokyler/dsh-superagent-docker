name: build

on:
  # Documentation-only changes cannot break the image, so they skip the build.
  push:
    paths-ignore: ['**.md', 'LICENSE', '.gitignore', '.dockerignore']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE', '.gitignore', '.dockerignore']
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the image
        run: |
          docker build -t dsh-superagent:ci \
            --build-arg SUPERAGENT_REF=main \
            --build-arg IMAGE_REVISION="${GITHUB_SHA::7}" \
            .

      - name: Check the prerequisites inside the image
        run: |
          docker run --rm --entrypoint /bin/bash dsh-superagent:ci -lc '
            set -e
            python3 --version
            tmux -V
            gh --version | head -1
            node -v
            dsh --version
            pnpm --version
            case "$(pnpm --version)" in 11.*) ;; *) echo "pnpm is not 11"; exit 1 ;; esac
            python3 -m pip --version
            python3 -m venv /tmp/v && echo "venv OK"
          '

      - name: Check the agent can install dependencies while it works
        run: |
          docker run --rm --entrypoint /bin/bash dsh-superagent:ci -lc '
            set -e
            id -un
            sudo -n true && echo "passwordless sudo OK"
          '

      - name: Check the bundle built, and the patch applied
        run: |
          docker run --rm --entrypoint /bin/bash dsh-superagent:ci -lc '
            set -e
            test -f /opt/dsh-superagent/lib/index.js
            test -f /opt/dsh-superagent/lib/client.js
            grep -q "SERVICE_COMMANDS" /opt/dsh-superagent/scripts/dsh-superagent
            echo "bundle + patch OK"
          '

      - name: Validate compose and entrypoint syntax
        run: |
          docker compose config > /dev/null
          bash -n entrypoint.sh scripts/smoke-test.sh

  # The build job proves the image; this job proves the entrypoint: profile
  # creation, bundle install, the socat hop, tmux start, DSH boot, the token
  # line, and status reporting "setup waits". It needs no model provider, no
  # GitHub account and no bot, because a fresh install is expected to stop at
  # "no repository" — which is exactly what the panel then fixes.
  runtime:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v5

      - name: Build the image
        run: docker build -t dsh-superagent:ci --build-arg IMAGE_REVISION="${GITHUB_SHA::7}" .

      - name: Start it
        run: |
          set -euo pipefail
          docker run -d --name dsh-superagent -p 127.0.0.1:3082:13082 \
            -e DSH_SUPERAGENT_ACCESS=proxy \
            -e DSH_SUPERAGENT_PUBLISHED_PORT=3082 \
            -e DSH_SUPERAGENT_SUPERVISE=0 \
            dsh-superagent:ci

      - name: Wait for the management API
        run: |
          set -euo pipefail
          for _ in $(seq 1 100); do
            if curl -sf --max-time 5 -H 'x-orchestrator-request: 1' \
                 http://127.0.0.1:3082/orchestrator/api/state > state.json; then
              echo "management API answered"
              exit 0
            fi
            sleep 4
          done
          echo "the panel never answered through the proxy" >&2
          exit 1

      - name: Assert a fresh install stops at "no repository"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d = json.load(open("state.json"))
          problem = (d.get("setup") or {}).get("problem") or {}
          print("setup problem:", json.dumps(problem, ensure_ascii=False))
          # No account is configured, so the Source has no repository yet: the
          # state every fresh install must reach before a person fills the panel.
          assert problem.get("code") == "repositoryUnset", problem
          assert (d.get("health") or {}).get("runtime", {}).get("state") in ("ready", "paused"), d.get("health")
          PY

      # The entrypoint holds the control lock while it starts the service and
      # reports the panel line, and `status` takes the same lock, so wait for the
      # entrypoint to finish before asking. A person would naturally do this too.
      - name: Wait for the entrypoint to finish starting
        run: |
          set -euo pipefail
          for _ in $(seq 1 100); do
            docker logs dsh-superagent > container.log 2>&1 || true
            if grep -qE 'panel: http://localhost:3082/\?token=' container.log; then
              grep -E '\[superagent\] (ready|running|not running|panel)' container.log
              exit 0
            fi
            sleep 4
          done
          echo "the entrypoint never printed a panel line" >&2
          cat container.log
          exit 1

      - name: Assert status reports "setup waits" (exit 3)
        run: |
          set -euo pipefail
          for attempt in $(seq 1 6); do
            code=0
            docker exec dsh-superagent scripts/dsh-superagent status > status-out.json 2>&1 || code=$?
            echo "attempt $attempt: exit=$code"
            cat status-out.json
            if [ "$code" = "3" ]; then exit 0; fi
            # 1 can mean the control lock is still held by the entrypoint.
            sleep 6
          done
          echo "ps inside the container:" >&2
          docker exec dsh-superagent ps -ww -ax -o pid=,ucomm=,args= | grep -E 'dsh|node' || true
          exit 1

      - name: Assert DSH bound the port the proxy forwards to
        run: |
          set -euo pipefail
          docker exec dsh-superagent sh -c \
            'grep -q "dsh web: http://127.0.0.1:3082/" $(ls -t /opt/dsh-superagent/.artifacts/dsh-superagent-*.log | head -1)'
          echo "DSH bound 3082"

      - name: Declared packages are installed at start, and cached across restarts
        run: |
          set -euo pipefail
          docker run -d --name dsh-pkg -p 127.0.0.1:3083:13082 \
            -e DSH_SUPERAGENT_ACCESS=proxy -e DSH_SUPERAGENT_PUBLISHED_PORT=3083 \
            -e DSH_SUPERAGENT_SUPERVISE=0 \
            -e DSH_SUPERAGENT_APT_PACKAGES=sl \
            dsh-superagent:ci
          for _ in $(seq 1 90); do
            if docker exec dsh-pkg sh -c 'command -v sl' >/dev/null 2>&1; then break; fi
            sleep 4
          done
          docker exec dsh-pkg sh -c 'command -v sl'
          docker logs dsh-pkg 2>&1 | grep -E 'installing declared packages: sl'
          docker logs dsh-pkg 2>&1 | grep -E 'declared packages installed: sl'
          # The list and the image revision form a marker, so a restart of the
          # same image must not touch the network again.
          docker restart dsh-pkg > /dev/null
          for _ in $(seq 1 30); do
            if docker logs dsh-pkg 2>&1 | grep -q 'declared packages already present: sl'; then
              echo "restart skipped the install"
              docker rm -f dsh-pkg
              exit 0
            fi
            sleep 4
          done
          echo "a restart reinstalled the packages instead of using the marker" >&2
          docker logs dsh-pkg || true
          docker rm -f dsh-pkg
          exit 1

      - name: Service log on failure
        if: failure()
        run: |
          echo "--- docker logs ---"
          docker logs dsh-superagent || true
          echo "--- dsh-superagent .artifacts log ---"
          docker exec dsh-superagent sh -c \
            'cat $(ls -t /opt/dsh-superagent/.artifacts/dsh-superagent-*.log | head -1)' || true

      - name: Clean up
        if: always()
        run: docker rm -f dsh-superagent dsh-pkg || true

  # Publishes the image to GitHub Container Registry on the default branch only,
  # after both other jobs pass. The package inherits the repository's visibility.
  publish:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    needs: [image, runtime]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          short="${GITHUB_SHA::7}"
          docker build \
            --build-arg IMAGE_REVISION="${short}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.licenses=MIT" \
            -t "${image}:latest" \
            -t "${image}:sha-${short}" \
            .
          docker push "${image}:latest"
          docker push "${image}:sha-${short}"
          echo "pushed ${image}:latest and ${image}:sha-${short}"
