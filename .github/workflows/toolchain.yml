name: toolchain

# What a base image actually ships, for choosing the base and judging whether an
# agent working inside it can build and test a repository. Dispatch only: it is a
# diagnostic, not part of the build.

on:
  workflow_dispatch:
    inputs:
      image:
        description: Image to inspect
        required: false
        default: node:24-bookworm

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect
        run: |
          docker run --rm "${{ inputs.image }}" bash -lc '
            echo "== distro =="
            head -2 /etc/os-release
            echo
            echo "== interpreters and toolchains =="
            for t in git curl wget make gcc g++ cmake python3 pip3 pipx rg jq unzip xz tar patch file sqlite3 perl ruby go cargo java node npm pnpm corepack; do
              printf "%-9s " "$t"
              if command -v "$t" >/dev/null 2>&1; then
                "$t" --version 2>/dev/null | head -1 || echo "present (no --version)"
              else
                echo "-"
              fi
            done
            echo
            echo "== python packaging =="
            python3 -m pip --version 2>/dev/null || echo "pip module: missing"
            python3 -m venv --help >/dev/null 2>&1 && echo "venv: present" || echo "venv: missing"
            echo
            echo "== privileges =="
            id
            command -v sudo >/dev/null 2>&1 && echo "sudo: present" || echo "sudo: missing (cannot apt-get install at runtime)"
            echo
            echo "== debian packages installed =="
            dpkg -l 2>/dev/null | grep -c "^ii" || true
          '
